version: 2.1

# List of all environment variables accessible in this config file
# https://circleci.com/docs/2.0/env-vars/#built-in-environment-variables

# Recommendations
# ---------------

# General Principles:
#
#  1. Descriptive: The job name should clearly describe what the job does.
#  2. Concise: Names should be as short as possible while still being descriptive.
#  3. Consistent: Use a consistent format or pattern for all job names.
#  4. Avoid Ambiguous Abbreviations: If you use abbreviations, ensure they are widely understood.
#
# Naming Convention Proposal:
#
#  1. Prefixes based on the nature of the job:
#     - build-: for jobs related to building or installation.
#     - lint-: for jobs related to code quality checking.
#     - test-: for jobs related to testing.
#     - security-: for jobs related to security.
#     - metrics-: for jobs related to metrics generation.
#     - deploy-: for jobs related to deployment.
#     - notify-: for jobs related to notifications.
#     - debug-: for jobs related to debugging.
#     - setup-: for jobs related to set up.
#     - init-: for jobs related to initialization.
#     - generate-: for jobs related to generation.
#     - validate-: for jobs related to validation.
#     - compile-: for jobs related to compilation.
#     - e2e-: for jobs related to end-to-end testing.
#
#  2. Suffixes based on the specific tool or task:
#  For example, for a job that uses PHP_CodeSniffer, use phpcs as a suffix.


# Default configuration for persist_to_workspace and attach_workspace commands
persist_to_workspace: &persist_to_workspace
  persist_to_workspace:
    root: .
    paths:
      - .

attach_workspace: &attach_workspace
  attach_workspace:
    # Must be absolute path or relative path from working_directory
    at: ~/project

# This main executor is used by all jobs unless otherwise specified
executors:
  php-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - name: localhost
        image: cimg/php:8.2
  builder-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - image: cimg/php:8.2-node
        name: localhost
  simple-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - image: cimg/base:stable
        name: localhost


commands:
  deploy-container:
    parameters:
      ssh-user:
        type: env_var_name
      ssh-host:
        type: env_var_name
      ssh-known-hosts:
        type: env_var_name
      container-name:
        type: string
      port:
        type: integer
      env-file:
        type: string
    steps:
      - add_ssh_keys
      - run:
          name: Trust the server host key
          command: |
            mkdir -p ~/.ssh
            echo "${<< parameters.ssh-known-hosts >>}" >> ~/.ssh/known_hosts
      - run:
          name: Pull the image of this branch on the server
          command: |
            set -eo pipefail
            REPOSITORY=$(echo "ghcr.io/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" | tr '[:upper:]' '[:lower:]' | tr -d '_')
            TAG=$(echo $CIRCLE_BRANCH | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c 1-128)
            echo "export IMAGE=$REPOSITORY:$TAG" >> $BASH_ENV
            echo "$GHCR_READ_PAT" | ssh "${<< parameters.ssh-user >>}@${<< parameters.ssh-host >>}" \
              "docker login ghcr.io -u $GHCR_USERNAME --password-stdin > /dev/null && docker pull -q $REPOSITORY:$TAG; status=\$?; docker logout ghcr.io > /dev/null; exit \$status"
      - run:
          name: Replace the container, roll back if it does not answer
          command: |
            ssh "${<< parameters.ssh-user >>}@${<< parameters.ssh-host >>}" bash -s -- \
              "$IMAGE" "$CIRCLE_SHA1" "<< parameters.container-name >>" "<< parameters.port >>" "<< parameters.env-file >>" \<< 'EOF'
            set -euo pipefail
            image=$1 revision=$2 name=$3 port=$4 env_file=$5

            exec 9> /tmp/tp3-deploy.lock
            flock -w 60 9

            built_from=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            if [ "$built_from" != "$revision" ]; then
              echo "$image was built from $built_from, expected $revision: wait for build-docker-image, then rerun this job" >&2
              exit 1
            fi

            if docker container inspect "$name" > /dev/null 2>&1; then
              docker rm -f "$name-previous" > /dev/null 2>&1 || true
              docker stop "$name" > /dev/null
              docker rename "$name" "$name-previous"
            fi

            docker run -d --name "$name" --restart unless-stopped -p "$port:80" --env-file "$env_file" "$image" > /dev/null

            for _ in $(seq 1 15); do
              if curl -fsS --max-time 3 -o /dev/null "http://localhost:$port/"; then
                docker rm -f "$name-previous" > /dev/null 2>&1 || true
                docker image prune -f > /dev/null
                echo "$name now runs $image ($revision)"
                exit 0
              fi
              sleep 2
            done

            echo "$name did not answer on port $port, rolling back" >&2
            docker logs --tail 30 "$name" >&2 || true
            docker rm -f "$name" > /dev/null
            if docker container inspect "$name-previous" > /dev/null 2>&1; then
              docker rename "$name-previous" "$name"
              docker start "$name" > /dev/null
            fi
            exit 1
            EOF


jobs:
  debug-info:
    executor: php-executor
    steps:
      - run:
          name: Debug
          command: |
            echo "Current user: $USER"
            echo "Home directory: $HOME"
            echo "Current shell: $SHELL"
            echo "Operating system: $(uname -a)"
            echo "Current path: $PATH"
            echo "Current working directory: $(pwd)"
            echo "Current date: $(date)"
            echo "--------------------"
            env

  build-setup:
    executor: php-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            # "composer.lock" can be used if it is committed to the repo
            - v1-dependencies-{{ checksum "composer.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: composer install --no-interaction --no-ansi --prefer-dist
      - save_cache:
          paths:
            - ./vendor
          key: v1-dependencies-{{ checksum "composer.json" }}
      - *persist_to_workspace


  lint-phpcs:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install PHP_CodeSniffer and PHPCompatibility
          command: composer require --dev "squizlabs/php_codesniffer=*" "phpcompatibility/php-compatibility=*"
      - run:
          name: Run PHP_CodeSniffer with Custom Ruleset in the project root
          command: |
            ./vendor/bin/phpcs --standard=phpcs.xml --report-file=phpcs-report.txt --report=checkstyle --extensions=php --ignore=vendor/ .
            result=$?
            if [ $result -eq 1 ] || [ $result -eq 2 ]; then
              exit 0
            else
              exit $result
            fi
      - store_artifacts:
          path: phpcs-report.txt
          destination: phpcs-report



  security-check-dependencies:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install local-php-security-checker
          command: |
            curl -L -o local-php-security-checker https://github.com/fabpot/local-php-security-checker/releases/download/v2.0.6/local-php-security-checker_2.0.6_linux_amd64
            chmod +x local-php-security-checker
      - run:
          name: Run local-php-security-checker
          command: ./local-php-security-checker --format=json --no-dev > security-report.json
      - store_artifacts:
          path: security-report.json
          destination: security-report



  test-phpunit:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Check if PHPUnit tests are present, otherwise skip the job
          command: |
            if [ ! -f "phpunit.xml" ]; then
              echo "No PHPUnit tests found, skipping job."
              echo "export SKIP_PHPUNIT=true" >> $BASH_ENV
              circleci step halt
            fi
      - run:
          name: Run PHPUnit
          command: ./vendor/bin/phpunit --testsuite=Unit


  lint-phpmd:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install PHPMD
          command: composer require --dev phpmd/phpmd
      - run:
          name: Run PHPMD
          command: |
            ./vendor/bin/phpmd analyze --format text --no-progress \
              --ruleset cleancode --ruleset codesize --ruleset controversial \
              --ruleset design --ruleset naming --ruleset unusedcode \
              --reportfile-html phpmd-report.html --ignore-violations-on-exit \
              src public
      - store_artifacts:
          path: phpmd-report.html
          destination: phpmd-report


  lint-php-doc-check:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install php-doc-check
          command: composer require --dev niels-de-blaauw/php-doc-check
      - run:
          name: Run php-doc-check
          command: ./vendor/bin/php-doc-check --ignore-violations-on-exit src public | tee php-doc-check-report.txt
      - store_artifacts:
          path: php-doc-check-report.txt
          destination: php-doc-check-report


  metrics-phpmetrics:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install PhpMetrics
          command: composer require --dev phpmetrics/phpmetrics
      - run:
          name: Run PhpMetrics
          command: ./vendor/bin/phpmetrics --report-html=phpmetrics-report --report-json=phpmetrics-report/report.json src,public
      - store_artifacts:
          path: phpmetrics-report
          destination: phpmetrics-report


  metrics-phploc:
    executor: php-executor
    steps:
      - *attach_workspace
      # phploc is abandoned: through composer it resolves to 2.0.5, the 7.x line only ships as a phar
      - run:
          name: Install phploc
          command: curl -sSfL -o phploc.phar https://phar.phpunit.de/phploc-7.0.2.phar
      - run:
          name: Run phploc
          command: php phploc.phar src public | tee phploc-report.txt
      - store_artifacts:
          path: phploc-report.txt
          destination: phploc-report


  build-docker-image:
    executor: builder-executor
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and Push Docker Image to GHCR (GitHub Container Registry)
          command: |
            if [ ! -z "$SKIP_BUILD" ]; then
              echo "Skipping build"
              circleci step halt
              exit 0
            fi

            # Sanitize the repository name and branch name
            REPOSITORY=$(echo "ghcr.io/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" | tr '[:upper:]' '[:lower:]' | tr -d '_')
            TAG=$(echo $CIRCLE_BRANCH | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c 1-128)

            # Login to GHCR
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Build the Docker image
            docker build \
            -f Docker/Dockerfile \
            -t $REPOSITORY:$TAG \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg TAG="${TAG}" \
            --build-arg GIT_COMMIT=$(git rev-parse -q --verify HEAD) \
            --build-arg GIT_URL=$(echo ${CIRCLE_REPOSITORY_URL} | sed -e 's/^git@/https:\/\//g' -e 's/\.git$//g' -e 's/:/\//g') \
            --build-arg SQLITE_VERSION=3430200 \
            --build-arg SQLITE_YEAR=2023 \
            --build-arg PROJECT_USERNAME=$CIRCLE_PROJECT_USERNAME \
            .

            # Push the Docker image
            docker push $REPOSITORY:$TAG


  deploy-ssh-staging:
    executor: simple-executor
    steps:
      - deploy-container:
          ssh-user: STAGING_SSH_USER
          ssh-host: STAGING_SSH_HOST
          ssh-known-hosts: STAGING_SSH_KNOWN_HOSTS
          container-name: tp3-staging
          port: 8080
          env-file: /etc/tp3/staging.env


  deploy-ssh-production:
    executor: simple-executor
    steps:
      - deploy-container:
          ssh-user: PROD_SSH_USER
          ssh-host: PROD_SSH_HOST
          ssh-known-hosts: PROD_SSH_KNOWN_HOSTS
          container-name: tp3-prod
          port: 80
          env-file: /etc/tp3/prod.env


workflows:
  main_workflow:
    jobs:
      - debug-info
      - build-setup
      - lint-phpcs:
          requires:
            - build-setup
      - security-check-dependencies:
          requires:
            - build-setup
      - test-phpunit:
          requires:
            - build-setup
      - lint-phpmd:
          requires:
            - build-setup
      - lint-php-doc-check:
          requires:
            - build-setup
      - metrics-phpmetrics:
          requires:
            - build-setup
      - metrics-phploc:
          requires:
            - build-setup
      - hold:
          type: approval
          filters:
            branches:
              only:
                - main
                - master
                - /^release\/.*/
      - deploy-ssh-production:
          requires:
            - hold
          filters:
            branches:
              only:
                - main
                - master
      - deploy-ssh-staging:
          requires:
            - hold
          filters:
            branches:
              only:
                - /^release\/.*/


  container_workflow:
    jobs:
      - build-docker-image:
          filters:
            branches:
              only:
                - master
                - main
                - develop
                - /^feature\/.*/
                - /^release\/.*/
                - /^hotfix\/.*/
                - /^bugfix\/.*/